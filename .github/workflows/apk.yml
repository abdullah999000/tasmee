
name: Build Tasmee APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build APK
        run: |
          chmod +x build_apk.sh
          ./build_apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasmee-APK
          path: tasmee.apk
          if-no-files-found: error
